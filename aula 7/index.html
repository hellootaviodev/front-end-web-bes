<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendendo JavasScript</title>
    <link rel="stylesheet" href="./styles/global.css">
    <script src="./scripts/index.js" defer></script>
</head>
    <header>
        <h1>Formulario Super Simples</h1>
    </header>
    <main>
        <h1>Cadastro</h1>
        <form id="Cadastro">
            <label for="nome">Nome</label>
            <input type="text" id="Nome">
            <p id="erro-Nome" class="oculto"></p>

            <label for="idade">idade</label>
            <input type="number" id="idade">
            <p id="erro-idade" class="oculto"></p>

            <label for="email">email</label>
            <input type="email" id="email">
            <p id="erro-email" class="oculto"></p>

            <label>
                <input type="checkbox" id="termos">
                <span>Li e aceito os termos</span>
                <p id="erro-termos" class="oculto"></p>
            </label>

            <button onclick="executar(event)">Enviar</button>
            <p id="concluido" class="oculto"></p>
        </form>

    </main>
    <footer>
        Projeto para Conhecermos o JavasScript

    </footer>

    
</body>
</html>
