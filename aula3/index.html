!DOCTYPE html>
<html lang="pt-BR">
 <head>
    <title> Recrutamento online</title>
    <meta charset="UTF-8">
 </head>
    <body>
       <header>
        <h1>Recrutamento online</h1>
       </header> 
       <main>
        <section>
            <h2>Cadastre o seu Curriculo</h2>
            <form action="https://postman-echo.com/get" method="get">
                <p>Preencha o formulario abaixo para se candidatar a vaga</p>
                <fieldset>
                    <legend>Dados pessoais</legend>
                    <div>
                        
                        <label for="nome_id">Nome completo:</label>
                        <input id="nome_id" name="nome" type="text">
                    <div>
                        <p></p>
                    </div>
                        <label for="telefone-id">Telefone:</label>
                        <input id="telefone-id" name="telefone" type="tel">
                   </div>

                   <div>
                    <label for="Email_id">Email:</label>
                    ><input id="Email_id" name="Email" type="email">
                   </div>

                   <div>
                    <label for="data_nasc_id">data de nascimento</label>
                    <input id="data_nasc_id" name="data_nasc" type="date">
                   </div>

                <fieldset>
                    <legend>Endereço</legend>

                    <div>
                        <label for="logadouro:">logadouro</label>
                        <input id="logadouro_id" name="logadouro" type="text">
                    </div>

                    <div>
                        <label for="cidade_id">cidade_uf:</label>
                        <input id="cidade_id" name="cidade" type="text">
                    </div>

                    <div>
                        <label for="numero_id:">numero</label>
                        <input id="numero_id" name="numero" type="number">
                    </div>

                    </fieldset>
                    </fieldset>

                    <fieldset>
                        <legend>Resumo</legend>
                        <div>
                            <label for="resumo_id">fale sobre voçê</label>
                            <textarea id="resumo_id" name="resumo"></textarea>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Nivel desejado</legend>
                        <div>
                            <input id="nivel_estagio_id"
                            name="nivel"
                            type="radio"
                            value="estagio">
                        <label for="nivel_estagio_id">estagio</label>
                    </div>
                    <div>
                        <input id="nivel_junior_id"
                                name="nivel"
                                type="radio"
                                value="junior">
                        <label for="nivel_junior_id"> junior</label>
                    </div>
                    </fieldset>

                <fieldset>
                    <legend>tecnologias que domina</legend>
                    <div>
                        <input id="tec_css_id"
                               name="tecnologias"
                               type="checkbox"
                               value="CSS">
                        <label for="tec_css_id">CSS</label>
                    </div>

                    <div>
                        <input id="tec_js_id"
                        name="tecnologias"
                        type="checkbox"
                        value="js">
                        <label for="tec_js_id">JS</label>
                    </div>

                </fieldset>

                <fieldset>
                    <legend>grau de instrução</legend>
                    <div>
                        <label for="grau_instrucao_id">grau de instrução</label>
                        <select id="grau_instrucao_id" name="grau instrucao">
                            <option value="fundamental">fundamental</option>
                            <option value="medio">medio</option>
                            <option value="superior">superior</option>
                        </select>
                    </div>
                </fieldset>

                <div>
                    <button type="reset">Limpar dados</button>
                    <button type="submit">Enviar candidatura</button>
                </div>
                
            </form>
         </section>
       </main>
       <footer>
        <p>Todos os direitos preservados &copy;</p>
       </footer>
    </body>
</html>
